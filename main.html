<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>광란의 우주 : 하드코어 보스 (Hardcore Boss Edition)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
  :root{ --void:#04010A; }
  *{box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;}
  html,body{ background:var(--void); height:100%; overflow:hidden; font-family:'Orbitron',sans-serif; }
  #game{ position:fixed; inset:0; display:block; }

  /* 흔들림 강도 완화 (어지러움 방지) */
  body.shake{ animation: shake 0.15s linear; }
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    25%{ transform:translate(-4px,3px); }
    50%{ transform:translate(4px,-3px); }
    75%{ transform:translate(-3px,-2px); }
  }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; pointer-events:none;
    background:linear-gradient(rgba(4,1,10,0.85), rgba(4,1,10,0));
  }
  .hud-block{
    display:flex; align-items:center; gap:6px;
    color:#EAFFFC; font-size:12px; letter-spacing:0.05em;
    text-shadow:0 0 8px rgba(94,231,255,0.6);
  }
  #stageLabel{ font-size:14px; font-weight:900; color:#5EE7FF; }
  #lives{ display:flex; gap:4px; flex-wrap:wrap; max-width:140px; }
  .heart{ width:14px; height:14px; border-radius:50% 50% 50% 0; background:#FF5EC8; transform:rotate(-45deg); box-shadow:0 0 8px #FF5EC8; }
  
  #bossBarWrap{
    flex:1; height:12px; border-radius:6px; background:rgba(255,255,255,0.08);
    border:1px solid #FF0055; overflow:hidden; max-width:300px; min-width:80px;
    position:relative; box-shadow:0 0 10px rgba(255,0,85,0.3);
  }
  #bossBar{ height:100%; width:100%; background:linear-gradient(90deg,#FF0055,#FFD25E); transition:width 0.15s ease; }
  #bossTitle{
    position:absolute; inset:0; display:flex; align-items:center; justify-center:center;
    font-size:9px; font-weight:900; color:#FFF; text-shadow:0 0 4px #000; text-align:center;
  }

  #score{ font-size:13px; color:#FFD25E; text-shadow:0 0 8px rgba(255,210,80,0.7); }
  
  #grenadeHud{ display:flex; align-items:center; gap:6px; font-size:11px; color:#FF9900; font-weight:700; }
  #grenadeBarWrap{ width:45px; height:8px; border-radius:4px; background:rgba(255,255,255,0.1); border:1px solid #FF9900; overflow:hidden; }
  #grenadeBar{ height:100%; width:100%; background:#FF9900; }

  .hud-btn{
    pointer-events:auto; cursor:pointer; background:rgba(10,4,24,0.6);
    border:1px solid rgba(94,231,255,0.5); color:#EAFFFC; border-radius:8px;
    font-family:'Orbitron',sans-serif; font-size:10px; padding:5px 8px;
    transition:background 0.2s;
  }
  .hud-btn:hover{ background:rgba(94,231,255,0.25); }

  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:radial-gradient(circle at 50% 40%, rgba(50,10,70,0.85), rgba(4,1,10,0.98));
    text-align:center; padding:24px; gap:18px;
  }
  .overlay.hidden{ display:none; }
  .overlay h1{
    font-size:clamp(1.8rem,6vw,3.2rem); font-weight:900; color:#EAFFFC;
    text-shadow:0 0 10px rgba(94,231,255,0.9), 0 0 30px rgba(255,45,180,0.8);
    letter-spacing:0.04em;
  }
  .overlay p{ color:rgba(234,255,252,0.85); font-size:clamp(0.75rem,2.2vw,0.95rem); max-width:540px; line-height:1.6; }
  .overlay .sub{ color:#FFD25E; font-size:clamp(0.85rem,2.5vw,1.1rem); font-weight:700; }
  
  .neon-btn{
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:clamp(0.9rem,2.5vw,1.1rem);
    letter-spacing:0.08em; padding:0.8em 2em; color:#EAFFFC;
    background:rgba(10,4,24,0.55); border:2px solid rgba(94,231,255,0.75); border-radius:999px;
    cursor:pointer; box-shadow:0 0 18px rgba(94,231,255,0.55), inset 0 0 14px rgba(94,231,255,0.15);
    transition:transform .15s ease, background .15s ease;
  }
  .neon-btn:hover{ transform:scale(1.06); background:rgba(94,231,255,0.2); }
  .neon-btn:active{ transform:scale(0.96); }
  .neon-btn.pink{ border-color:rgba(255,94,200,0.8); box-shadow:0 0 18px rgba(255,94,200,0.5); }

  /* ---------- Card Selection UI ---------- */
  .card-container{
    display:flex; gap:16px; justify-content:center; flex-wrap:wrap; max-width:900px; width:100%; margin-top:10px;
  }
  .card{
    background:rgba(20,10,35,0.85); border:2px solid #5EE7FF; border-radius:14px;
    padding:18px 14px; width:220px; display:flex; flex-direction:column; align-items:center;
    gap:12px; cursor:pointer; transition:transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow:0 0 15px rgba(94,231,255,0.2); pointer-events:auto;
  }
  .card:hover{ transform:translateY(-8px) scale(1.04); box-shadow:0 0 25px rgba(94,231,255,0.6); }
  .card.buff{ border-color:#5EE7FF; }
  .card.debuff{ border-color:#FF2D70; }
  .card-icon{ font-size:36px; }
  .card-title{ font-size:15px; font-weight:900; color:#EAFFFC; }
  .card-desc{ font-size:11px; color:rgba(234,255,252,0.8); line-height:1.4; text-align:center; word-break:keep-all; }
  .card-tag{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:10px; }
  .buff .card-tag{ background:rgba(94,231,255,0.2); color:#5EE7FF; }
  .debuff .card-tag{ background:rgba(255,45,112,0.2); color:#FF2D70; }

  /* ---------- Touch controls ---------- */
  #touchControls{ position:fixed; inset:0; z-index:15; pointer-events:none; display:none; }
  body.touch #touchControls{ display:block; }
  #stick{
    position:fixed; left:26px; bottom:26px; width:130px; height:130px; border-radius:50%;
    background:rgba(94,231,255,0.08); border:2px solid rgba(94,231,255,0.4); pointer-events:auto;
  }
  #stickKnob{
    position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px;
    border-radius:50%; background:rgba(94,231,255,0.35); border:2px solid rgba(94,231,255,0.8);
    box-shadow:0 0 14px rgba(94,231,255,0.6);
  }
  #attackBtn{
    position:fixed; right:30px; bottom:34px; width:92px; height:92px; border-radius:50%;
    background:rgba(255,94,200,0.25); border:2px solid rgba(255,94,200,0.9); pointer-events:auto;
    color:#EAFFFC; font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; text-align:center;
    box-shadow:0 0 25px rgba(255,94,200,0.7);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-block" id="stageLabel">STAGE 1 / 100</div>
  <div class="hud-block" id="lives"></div>
  <div id="bossBarWrap">
    <div id="bossBar"></div>
    <div id="bossTitle">BOSS HP</div>
  </div>
  <div id="grenadeHud">💣 <div id="grenadeBarWrap"><div id="grenadeBar"></div></div></div>
  <div class="hud-block" id="score">SCORE 0</div>
  <button class="hud-btn" id="shakeBtn">📳 흔들림 켬</button>
  <button class="hud-btn" id="muteBtn">🔊 소리</button>
</div>

<div id="touchControls">
  <div id="stick"><div id="stickKnob"></div></div>
  <div id="attackBtn">플라즈마<br>참격</div>
</div>

<div class="overlay" id="screenTitle">
  <h1>광란의 우주 : 하드코어 보스</h1>
  <p class="sub">스테이지별 보스 스케일링 폭증 모드</p>
  <p>👹 <b>보스의 체력과 공격성이 스테이지마다 기하급수적으로 폭증합니다!</b><br>
  🃏 <b>카드를 전략적으로 선택하여 압도적인 보스를 격파하세요.</b><br>
  📳 <b>어지러우시면 상단의 '흔들림 끔' 버튼을 활용하세요.</b></p>
  <button class="neon-btn" id="startBtn">출격하기 (Enter)</button>
</div>

<div class="overlay hidden" id="screenClear">
  <h1>STAGE CLEAR!</h1>
  <p class="sub" id="clearScore"></p>
  <p>다음 스테이지 적용 강화/약화 카드를 선택하세요</p>
  <div class="card-container" id="cardContainer"></div>
</div>

<div class="overlay hidden" id="screenGameOver">
  <h1 style="color:#FF5EC8">MISSION FAILED</h1>
  <p class="sub" id="overStats"></p>
  <button class="neon-btn pink" id="retryBtn">처음부터 다시 (Enter)</button>
</div>

<div class="overlay hidden" id="screenWin">
  <h1 style="color:#FFD25E">🏆 전설의 은하 지배자 🏆</h1>
  <p class="sub" id="winScore"></p>
  <button class="neon-btn" id="winRetryBtn">다시 도전하기 (Enter)</button>
</div>

<div class="overlay hidden" id="screenPause">
  <h1>일시정지</h1>
  <p>WASD/방향키 이동 · 스페이스바 특수 참격 · P 일시정지</p>
  <button class="neon-btn" id="resumeBtn">계속하기</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H;
  const HUD_H = 70;

  // ---------------- Options & Audio ----------------
  let actx=null, muted=false, shakeEnabled=true;
  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function beep(type){
    if(muted || !actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const now = actx.currentTime;
    let freq=440, dur=0.12, wave='sine';
    if(type==='shoot'){ freq=800; dur=0.04; wave='square'; }
    else if(type==='grenade'){ freq=140; dur=0.35; wave='sawtooth'; }
    else if(type==='attack'){ freq=300; dur=0.12; wave='sawtooth'; }
    else if(type==='kill'){ freq=650; dur=0.18; wave='square'; }
    else if(type==='hurt'){ freq=110; dur=0.3; wave='sawtooth'; }
    else if(type==='clear'){ freq=880; dur=0.45; wave='triangle'; }
    else if(type==='card'){ freq=1050; dur=0.2; wave='sine'; }
    else if(type==='over'){ freq=90; dur=0.7; wave='sawtooth'; }
    o.type = wave; o.frequency.setValueAtTime(freq, now);
    if(type==='shoot'){ o.frequency.exponentialRampToValueAtTime(250, now+dur); }
    if(type==='clear'){ o.frequency.exponentialRampToValueAtTime(freq*1.5, now+dur); }
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(type==='shoot'?0.05:0.2, now+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.start(now); o.stop(now+dur+0.02);
  }

  function triggerShake(){
    if(!shakeEnabled) return;
    document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  }

  document.getElementById('muteBtn').addEventListener('click', ()=>{
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇 음소거' : '🔊 소리';
  });

  document.getElementById('shakeBtn').addEventListener('click', ()=>{
    shakeEnabled = !shakeEnabled;
    document.getElementById('shakeBtn').textContent = shakeEnabled ? '📳 흔들림 켬' : '📴 흔들림 끔';
  });

  // ---------------- Game Modifiers ----------------
  let playerStats = {
    bulletCount: 3,
    bulletSpread: 0.35,
    shootInterval: 0.14,
    bulletDamage: 1.5,
    moveSpeedMult: 1.0,
    grenadeCdMult: 1.0,
    enemySpeedMult: 1.0,
    enemyHpMult: 1.0,
  };

  function resetPlayerStats(){
    playerStats = {
      bulletCount: 3,
      bulletSpread: 0.35,
      shootInterval: 0.14,
      bulletDamage: 1.5,
      moveSpeedMult: 1.0,
      grenadeCdMult: 1.0,
      enemySpeedMult: 1.0,
      enemyHpMult: 1.0,
    };
  }

  const CARD_POOL = [
    { type:'buff', icon:'🔫', title:'산탄 화력 증대', desc:'부채꼴 발사체가 +2발 증가하지만 탄 퍼짐이 넓어집니다.', apply:()=>{ playerStats.bulletCount += 2; playerStats.bulletSpread += 0.12; } },
    { type:'buff', icon:'⚡', title:'초고속 연사', desc:'총기 공격 속도가 25% 빨라집니다.', apply:()=>{ playerStats.shootInterval *= 0.75; } },
    { type:'buff', icon:'💥', title:'플라즈마 과충전', desc:'총알 피해량이 45% 증가합니다.', apply:()=>{ playerStats.bulletDamage *= 1.45; } },
    { type:'buff', icon:'🏃', title:'부스터 엔진', desc:'이동 속도가 20% 상승합니다.', apply:()=>{ playerStats.moveSpeedMult *= 1.2; } },
    { type:'buff', icon:'💣', title:'수류탄 가속기', desc:'수류탄 자동 발사 쿨타임이 25% 감소합니다.', apply:()=>{ playerStats.grenadeCdMult *= 0.75; } },
    { type:'buff', icon:'❤️', title:'긴급 수리 Kit', desc:'플레이어 생명이 +1 회복됩니다.', apply:()=>{ lives = Math.min(8, lives + 1); } },
    
    { type:'debuff', icon:'👾', title:'외계 중력장', desc:'플레이어 이동 속도가 15% 감소하는 대신, 총알 데미지가 60% 폭증합니다.', apply:()=>{ playerStats.moveSpeedMult *= 0.85; playerStats.bulletDamage *= 1.6; } },
    { type:'debuff', icon:'👹', title:'보스 분노 증대', desc:'적의 체력이 40% 증가하지만, 수류탄 쿨타임이 40% 감소합니다.', apply:()=>{ playerStats.enemyHpMult *= 1.4; playerStats.grenadeCdMult *= 0.6; } },
    { type:'debuff', icon:'⚡', title:'우주 과부하', desc:'적들의 이동속도가 25% 빨라지지만, 부채꼴 발사체가 +1발 추가됩니다.', apply:()=>{ playerStats.enemySpeedMult *= 1.25; playerStats.bulletCount += 1; } }
  ];

  // ---------------- Game State ----------------
  let stageNum = 1;
  const DEFAULT_LIVES = 5;
  let lives = DEFAULT_LIVES;
  let score = 0;
  let running = false;
  let paused = false;
  let stageCleared = false;
  let bossDefeated = false;
  let stageCfg = null;

  const player = { 
    x:0,y:0,r:28,vx:0,vy:0, faceX:1, faceY:0, inv:0, 
    clawTimer:0, clawCd:0, clawAngle:0,
    autoShootCd: 0,
    grenadeTimer: 0 
  };

  let enemies = [];
  let playerBullets = []; 
  let enemyBullets = [];
  let grenades = [];     
  let particles = [];
  let shockwaves = [];

  const CLAW_DURATION = 0.22, CLAW_COOLDOWN = 0.35;
  const ACCEL = 2200, BASE_MAXSPEED = 380, FRICTION = 6.5;
  const BASE_GRENADE_INTERVAL = 5.0; 

  // ---------------- Input ----------------
  const keys = {};
  let touchVec = {x:0,y:0};
  let touchActive = false;

  window.addEventListener('keydown', (e)=>{
    ensureAudio();
    keys[e.code] = true;
    if(e.code==='Space'){ triggerClaw(); e.preventDefault(); }
    if(e.code==='KeyP' || e.code==='Escape'){ togglePause(); }
    
    if(e.code==='Enter'){
      if(!screenTitle.classList.contains('hidden')){
        document.getElementById('startBtn').click();
      } else if(!screenGameOver.classList.contains('hidden')){
        document.getElementById('retryBtn').click();
      } else if(!screenWin.classList.contains('hidden')){
        document.getElementById('winRetryBtn').click();
      }
    }
  });
  window.addEventListener('keyup', (e)=>{ keys[e.code]=false; });

  function inputVector(){
    if(touchActive){ return touchVec; }
    let x=0,y=0;
    if(keys['ArrowLeft']||keys['KeyA']) x-=1;
    if(keys['ArrowRight']||keys['KeyD']) x+=1;
    if(keys['ArrowUp']||keys['KeyW']) y-=1;
    if(keys['ArrowDown']||keys['KeyS']) y+=1;
    const len = Math.hypot(x,y);
    if(len>1){ x/=len; y/=len; }
    return {x,y};
  }

  if(matchMedia('(pointer:coarse)').matches){ document.body.classList.add('touch'); }
  const stickEl = document.getElementById('stick');
  const stickKnob = document.getElementById('stickKnob');
  const attackBtn = document.getElementById('attackBtn');
  let stickId = null, stickOrigin = {x:0,y:0};

  stickEl.addEventListener('touchstart', (e)=>{
    ensureAudio();
    const t = e.changedTouches[0];
    stickId = t.identifier;
    const r = stickEl.getBoundingClientRect();
    stickOrigin = { x:r.left+r.width/2, y:r.top+r.height/2 };
    touchActive = true;
    e.preventDefault();
  }, {passive:false});
  stickEl.addEventListener('touchmove', (e)=>{
    for(const t of e.changedTouches){
      if(t.identifier===stickId){
        let dx = t.clientX - stickOrigin.x, dy = t.clientY - stickOrigin.y;
        const max = 46;
        const d = Math.hypot(dx,dy);
        if(d>max){ dx = dx/d*max; dy = dy/d*max; }
        stickKnob.style.transform = `translate(${dx}px,${dy}px)`;
        touchVec = { x: dx/max, y: dy/max };
      }
    }
    e.preventDefault();
  }, {passive:false});
  function stickEnd(e){
    for(const t of e.changedTouches){
      if(t.identifier===stickId){
        stickId=null; touchActive=false; touchVec={x:0,y:0};
        stickKnob.style.transform = 'translate(0,0)';
      }
    }
  }
  stickEl.addEventListener('touchend', stickEnd);
  stickEl.addEventListener('touchcancel', stickEnd);
  attackBtn.addEventListener('touchstart', (e)=>{ ensureAudio(); triggerClaw(); e.preventDefault(); }, {passive:false});

  // ---------------- Resize ----------------
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  // ---------------- Stars background ----------------
  let stars = [];
  function buildStars(){
    stars = Array.from({length: Math.floor((W*H)/5000)}, ()=>({
      x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.8+0.5,
      tw: Math.random()*Math.PI*2, sp: Math.random()*3+1
    }));
  }
  buildStars();
  window.addEventListener('resize', buildStars);

  // ---------------- Stage & Boss Generation ----------------
  function genStage(n){
    const generalMultiplier = (1.0 + (n - 1) * 0.08) * playerStats.enemyHpMult;
    
    // 👹 보스 체력 배율 대폭 상승 (기본 100 + n * 45 * 배율)
    const bossHp = Math.floor((100 + n * 45 + Math.pow(n, 1.4) * 8) * generalMultiplier);
    
    const enemyCount = Math.min(25, 5 + Math.floor(n * 0.5));
    const speedBase = (110 + Math.min(240, n * 3.0)) * playerStats.enemySpeedMult;
    
    // 보스 공격 속도 가속 (최소 0.5초까지 난사)
    const bossAttackRate = Math.max(0.5, 1.8 - n * 0.035);

    return { enemyCount, speedBase, bossHp, bossAttackRate, multiplier: generalMultiplier, n };
  }

  function rand(a,b){ return a + Math.random()*(b-a); }

  function spawnEnemy(type, cfg, boss){
    const edge = Math.floor(Math.random()*4);
    let x,y;
    if(edge===0){ x=rand(0,W); y=HUD_H+10; }
    else if(edge===1){ x=rand(0,W); y=H-10; }
    else if(edge===2){ x=10; y=rand(HUD_H,H); }
    else { x=W-10; y=rand(HUD_H,H); }
    const ang = Math.atan2((player.y||H/2)-y, (player.x||W/2)-x) + rand(-0.4,0.4);
    let speed, r, hp, color;
    
    if(boss){
      speed = cfg.speedBase * 0.38;
      r = 95;
      hp = cfg.bossHp;
      color = '#B000FF';
    } else if(type==='hunter'){
      speed = cfg.speedBase * 1.1; r = 24;
      hp = Math.floor((18 + cfg.n * 0.6) * cfg.multiplier);
      color = '#FF3300';
    } else if(type==='scout'){
      speed = cfg.speedBase * 0.85; r = 20;
      hp = Math.floor((10 + cfg.n * 0.4) * cfg.multiplier);
      color = '#FF00A0';
    } else {
      speed = cfg.speedBase * 0.6; r = 22;
      hp = Math.floor((5 + cfg.n * 0.3) * cfg.multiplier);
      color = '#00E5FF';
    }
    
    enemies.push({
      x,y, vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed, r, hp, maxHp:hp,
      type: boss?'boss':type, speed, color, dead:false, flash:0, spin: Math.random()*Math.PI*2,
      shootCd: rand(0.5, cfg.bossAttackRate)
    });
  }

  function spawnStageEntities(cfg){
    enemies = []; enemyBullets = []; playerBullets = []; grenades = [];
    spawnEnemy(null, cfg, true); // 매 스테이지 강화된 보스 생성

    for(let i=0; i<cfg.enemyCount; i++){
      let type = 'asteroid';
      const r = Math.random();
      if(cfg.n >= 4 && r < 0.40) type = 'hunter';
      else if(cfg.n >= 2 && r < 0.75) type = 'scout';
      spawnEnemy(type, cfg, false);
    }
  }

  function startStage(n){
    stageNum = n;
    stageCfg = genStage(n);
    bossDefeated = false; stageCleared = false;
    
    lives = DEFAULT_LIVES;

    player.x = W/2; player.y = H/2 + 40;
    player.vx=0; player.vy=0; player.inv=1200;
    player.grenadeTimer = BASE_GRENADE_INTERVAL * playerStats.grenadeCdMult; 
    spawnStageEntities(stageCfg);
    particles = []; shockwaves = [];
    updateHUDStatic();
  }

  // ---------------- Player Weapon Systems ----------------
  function autoShoot(dt){
    player.autoShootCd -= dt;
    if(player.autoShootCd <= 0){
      player.autoShootCd = playerStats.shootInterval;
      const faceAng = Math.atan2(player.faceY, player.faceX);
      const bSpeed = 850;
      const count = playerStats.bulletCount;
      const totalSpread = playerStats.bulletSpread;

      for(let i=0; i<count; i++){
        const spreadOffset = count > 1 ? (i / (count - 1) - 0.5) * totalSpread : 0;
        const ang = faceAng + spreadOffset;
        playerBullets.push({
          x: player.x + Math.cos(ang)*player.r,
          y: player.y + Math.sin(ang)*player.r,
          vx: Math.cos(ang)*bSpeed,
          vy: Math.sin(ang)*bSpeed,
          damage: playerStats.bulletDamage,
          r: 5, life: 1.0
        });
      }
      beep('shoot');
    }

    player.grenadeTimer += dt;
    const currentGrenadeInterval = BASE_GRENADE_INTERVAL * playerStats.grenadeCdMult;
    if(player.grenadeTimer >= currentGrenadeInterval){
      player.grenadeTimer = 0;
      launchGrenade();
    }
  }

  function launchGrenade(){
    const faceAng = Math.atan2(player.faceY, player.faceX);
    const targetDist = 240;
    grenades.push({
      x: player.x, y: player.y,
      startX: player.x, startY: player.y,
      targetX: Math.max(40, Math.min(W-40, player.x + Math.cos(faceAng)*targetDist)),
      targetY: Math.max(HUD_H+40, Math.min(H-40, player.y + Math.sin(faceAng)*targetDist)),
      progress: 0, r: 12
    });
    beep('grenade');
  }

  function normAngle(a){ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; }

  function triggerClaw(){
    if(!running || paused || stageCleared) return;
    if(player.clawCd > 0) return;
    player.clawCd = CLAW_COOLDOWN;
    player.clawTimer = CLAW_DURATION;
    const faceAng = Math.atan2(player.faceY, player.faceX);
    player.clawAngle = faceAng;
    beep('attack');

    shockwaves.push({
      x: player.x + Math.cos(faceAng)*30, y: player.y + Math.sin(faceAng)*30,
      ang: faceAng, r: 30, maxR: 140, alpha: 1
    });

    const range = player.r + 110;
    for(const en of enemies){
      if(en.dead) continue;
      const dx = en.x-player.x, dy = en.y-player.y;
      const dist = Math.hypot(dx,dy);
      if(dist < range + en.r){
        const ang = Math.atan2(dy,dx);
        if(Math.abs(normAngle(ang-faceAng)) < Math.PI*0.75){
          en.hp -= 20 * playerStats.bulletDamage;
          en.flash = 0.25;
          const push = en.type==='boss' ? 80 : 380;
          en.vx += Math.cos(ang)*push; en.vy += Math.sin(ang)*push;
          spawnParticles(en.x, en.y, '#5EE7FF', 14);

          if(en.hp <= 0){
            en.dead = true;
            score += en.type==='boss' ? 1000 : 35;
            spawnParticles(en.x, en.y, en.color, en.type==='boss'?80:20);
            beep('kill');
            if(en.type==='boss') bossDefeated = true;
          }
        }
      }
    }
  }

  // ---------------- Particles ----------------
  function spawnParticles(x,y,color,count){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = rand(80,420);
      particles.push({ x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:0, maxLife: rand(0.3,0.7), color, r: rand(2,6) });
    }
  }

  // ---------------- Update ----------------
  function update(dt){
    if(!running || paused || stageCleared) return;

    const iv = inputVector();
    const currentSpeedCap = BASE_MAXSPEED * playerStats.moveSpeedMult;
    player.vx += iv.x*ACCEL*dt;
    player.vy += iv.y*ACCEL*dt;
    player.vx /= (1+FRICTION*dt);
    player.vy /= (1+FRICTION*dt);
    const spd = Math.hypot(player.vx,player.vy);
    if(spd > currentSpeedCap){ player.vx = player.vx/spd*currentSpeedCap; player.vy = player.vy/spd*currentSpeedCap; }
    player.x += player.vx*dt; player.y += player.vy*dt;
    player.x = Math.max(player.r, Math.min(W-player.r, player.x));
    player.y = Math.max(HUD_H+player.r, Math.min(H-player.r, player.y));
    if(spd > 20){ player.faceX = player.vx/spd; player.faceY = player.vy/spd; }

    if(player.inv>0) player.inv -= dt*1000;
    if(player.clawTimer>0) player.clawTimer -= dt;
    if(player.clawCd>0) player.clawCd -= dt;

    autoShoot(dt);

    for(const g of grenades){
      g.progress += dt * 2.2;
      g.x = g.startX + (g.targetX - g.startX)*g.progress;
      g.y = g.startY + (g.targetY - g.startY)*g.progress;

      if(g.progress >= 1.0){
        g.exploded = true;
        triggerShake();
        spawnParticles(g.x, g.y, '#FF9900', 45);
        spawnParticles(g.x, g.y, '#FF2D3D', 30);
        beep('grenade');

        const blastRadius = 150;
        for(const en of enemies){
          if(en.dead) continue;
          if(Math.hypot(en.x - g.x, en.y - g.y) < blastRadius + en.r){
            en.hp -= 35 * playerStats.bulletDamage;
            en.flash = 0.3;
            const ang = Math.atan2(en.y - g.y, en.x - g.x);
            const push = en.type==='boss' ? 100 : 450;
            en.vx += Math.cos(ang)*push; en.vy += Math.sin(ang)*push;

            if(en.hp <= 0){
              en.dead = true;
              score += en.type==='boss' ? 1000 : 35;
              spawnParticles(en.x, en.y, en.color, en.type==='boss'?80:20);
              beep('kill');
              if(en.type==='boss') bossDefeated = true;
            }
          }
        }
      }
    }
    grenades = grenades.filter(g => !g.exploded);

    for(const sw of shockwaves){ sw.r += dt*400; sw.alpha -= dt*3.2; }
    shockwaves = shockwaves.filter(sw=>sw.alpha>0);

    for(const pb of playerBullets){
      pb.x += pb.vx*dt; pb.y += pb.vy*dt; pb.life -= dt;

      for(const en of enemies){
        if(en.dead) continue;
        if(Math.hypot(pb.x-en.x, pb.y-en.y) < pb.r + en.r){
          pb.dead = true;
          en.hp -= pb.damage; 
          en.flash = 0.08;
          spawnParticles(pb.x, pb.y, '#5EE7FF', 2);
          
          if(en.hp <= 0){
            en.dead = true;
            score += en.type==='boss' ? 1000 : 35;
            spawnParticles(en.x, en.y, en.color, en.type==='boss'?80:20);
            beep('kill');
            if(en.type==='boss') bossDefeated = true;
          }
          break;
        }
      }
    }
    playerBullets = playerBullets.filter(pb => !pb.dead && pb.life > 0);

    for(const en of enemies){
      if(en.dead) continue;
      if(en.flash>0) en.flash -= dt;
      en.spin += dt*2.5;
      
      const dx = player.x-en.x, dy = player.y-en.y;
      const d = Math.hypot(dx,dy)||1;
      const homing = en.type==='hunter' ? 340 : (en.type==='boss' ? 150 : 220);
      en.vx += (dx/d)*homing*dt;
      en.vy += (dy/d)*homing*dt;

      // 👹 보스 광란 탄막 공격
      if(en.type==='boss'){
        en.shootCd -= dt;
        if(en.shootCd <= 0){
          en.shootCd = stageCfg.bossAttackRate;
          
          // 촘촘해진 방사 탄막 폭풍 (스테이지가 올라갈수록 탄수 증가)
          const bCount = Math.min(28, 16 + Math.floor(stageNum * 0.8));
          const bulletSpd = 210 + Math.min(180, stageNum * 4);

          for(let b=0; b<bCount; b++){
            const bAng = (b/bCount)*Math.PI*2 + en.spin;
            enemyBullets.push({
              x: en.x, y: en.y,
              vx: Math.cos(bAng)*bulletSpd, vy: Math.sin(bAng)*bulletSpd,
              r: 7, color: '#FF0055'
            });
          }
          
          // 플레이어 저격 탄막 (3구 발사)
          const aimAng = Math.atan2(player.y - en.y, player.x - en.x);
          for(let off of [-0.22, 0, 0.22]){
            enemyBullets.push({
              x: en.x, y: en.y,
              vx: Math.cos(aimAng + off)*(bulletSpd + 120), vy: Math.sin(aimAng + off)*(bulletSpd + 120),
              r: 9, color: '#FFD25E'
            });
          }
        }
      }

      const sp = Math.hypot(en.vx,en.vy);
      const cap = en.speed*1.4;
      if(sp>cap){ en.vx = en.vx/sp*cap; en.vy = en.vy/sp*cap; }
      en.x += en.vx*dt; en.y += en.vy*dt;
      if(en.x < en.r){ en.x=en.r; en.vx*=-1; }
      if(en.x > W-en.r){ en.x=W-en.r; en.vx*=-1; }
      if(en.y < HUD_H+en.r){ en.y=HUD_H+en.r; en.vy*=-1; }
      if(en.y > H-en.r){ en.y=H-en.r; en.vy*=-1; }

      if(player.inv<=0 && Math.hypot(en.x-player.x,en.y-player.y) < en.r+player.r*0.85){
        lives--; player.inv = 1400; beep('hurt'); triggerShake();
        const ang = Math.atan2(player.y-en.y, player.x-en.x);
        player.vx += Math.cos(ang)*350; player.vy += Math.sin(ang)*350;
        spawnParticles(player.x,player.y,'#FF5EC8',16);
        if(lives<=0){ triggerGameOver(); return; }
      }
    }
    enemies = enemies.filter(e=>!e.dead);

    for(const b of enemyBullets){
      b.x += b.vx*dt; b.y += b.vy*dt;
      if(player.inv<=0 && Math.hypot(b.x-player.x, b.y-player.y) < b.r + player.r*0.8){
        lives--; player.inv = 1400; b.dead = true; beep('hurt'); triggerShake();
        spawnParticles(player.x,player.y,'#FF5EC8',14);
        if(lives<=0){ triggerGameOver(); return; }
      }
    }
    enemyBullets = enemyBullets.filter(b=> !b.dead && b.x>=0 && b.x<=W && b.y>=HUD_H && b.y<=H);

    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life+=dt; p.vx*=0.93; p.vy*=0.93; }
    particles = particles.filter(p=>p.life<p.maxLife);

    updateHUDDynamic();

    if(!stageCleared && bossDefeated){
      triggerStageClear();
    }
  }

  // ---------------- Draw ----------------
  function drawStars(t){
    ctx.fillStyle = 'rgba(4,1,10,1)'; ctx.fillRect(0,0,W,H);
    for(const s of stars){
      const a = 0.4 + Math.sin(t*0.001*s.sp + s.tw)*0.4 + 0.2;
      ctx.beginPath(); ctx.fillStyle = `rgba(200,220,255,${Math.max(0.15,a)})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
  }

  function drawGrenades(){
    for(const g of grenades){
      ctx.save(); ctx.beginPath(); ctx.fillStyle = '#FF9900';
      ctx.shadowColor = '#FF2D3D'; ctx.shadowBlur = 18;
      ctx.arc(g.x, g.y, g.r, 0, Math.PI*2); ctx.fill(); ctx.restore();
    }
  }

  function drawEnemy(en){
    ctx.save();
    ctx.translate(en.x,en.y);
    const moveAng = Math.atan2(en.vy, en.vx);
    const isFlashing = en.flash > 0;
    
    ctx.shadowColor = en.color;
    ctx.shadowBlur = isFlashing ? 35 : 18;
    ctx.strokeStyle = isFlashing ? '#FFFFFF' : en.color;
    ctx.fillStyle = isFlashing ? '#FFFFFF' : '#0D081D';
    ctx.lineWidth = 3;

    if(en.type==='boss'){
      ctx.rotate(en.spin*0.3);
      
      // Outer Rotating Spikes Ring
      ctx.beginPath();
      for(let i=0; i<12; i++){
        const a = (i/12)*Math.PI*2;
        const r1 = en.r * 1.15;
        const r2 = en.r * 0.85;
        ctx.lineTo(Math.cos(a)*r1, Math.sin(a)*r1);
        ctx.lineTo(Math.cos(a+0.2)*r2, Math.sin(a+0.2)*r2);
      }
      ctx.closePath(); ctx.stroke();

      // Main Core Body
      ctx.beginPath(); ctx.arc(0,0,en.r*0.8,0,Math.PI*2); ctx.fill(); ctx.stroke();

      // Glowing Evil Eyes
      ctx.beginPath(); ctx.fillStyle = isFlashing?'#FFFFFF':'#FF0055';
      ctx.shadowColor='#FF0055'; ctx.shadowBlur=20;
      ctx.arc(-en.r*0.3,-en.r*0.15,en.r*0.18,0,Math.PI*2);
      ctx.arc(en.r*0.3,-en.r*0.15,en.r*0.18,0,Math.PI*2); ctx.fill();

    } else if(en.type==='asteroid'){
      ctx.rotate(en.spin);
      ctx.beginPath();
      for(let i=0; i<6; i++){
        const a = (i/6)*Math.PI*2;
        const rr = en.r * (i%2===0 ? 1 : 0.75);
        if(i===0) ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
        else ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();

    } else if(en.type==='scout'||en.type==='hunter'){
      ctx.rotate(moveAng);
      ctx.beginPath();
      ctx.moveTo(en.r*1.2, 0); ctx.lineTo(-en.r*0.8, -en.r*0.8);
      ctx.lineTo(-en.r*0.3, 0); ctx.lineTo(-en.r*0.8, en.r*0.8);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();

    if(en.hp < en.maxHp && en.type!=='boss'){
      const bw = en.r*2.2, bh=6;
      ctx.save();
      ctx.translate(en.x-bw/2, en.y-en.r-14);
      ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(0,0,bw,bh);
      ctx.fillStyle='#00E5FF'; 
      ctx.fillRect(0,0,bw*(Math.max(0,en.hp)/en.maxHp),bh);
      ctx.restore();
    }
  }

  function drawPlayerBullets(){
    for(const pb of playerBullets){
      ctx.save(); ctx.beginPath();
      ctx.fillStyle = '#5EE7FF'; ctx.shadowColor = '#5EE7FF'; ctx.shadowBlur = 12;
      ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI*2); ctx.fill(); ctx.restore();
    }
  }

  function drawEnemyBullets(){
    for(const b of enemyBullets){
      ctx.save(); ctx.beginPath();
      ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 10;
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.restore();
    }
  }

  function drawPlayer(){
    const p = player;
    ctx.save(); ctx.translate(p.x,p.y);
    if(p.inv>0 && Math.floor(p.inv/90)%2===0){ ctx.globalAlpha = 0.35; }

    const faceAng = Math.atan2(p.faceY,p.faceX);

    for(const sw of shockwaves){
      ctx.save(); ctx.translate(sw.x - p.x, sw.y - p.y); ctx.rotate(sw.ang);
      ctx.beginPath(); ctx.strokeStyle = `rgba(94, 231, 255, ${sw.alpha})`;
      ctx.fillStyle = `rgba(255, 94, 200, ${sw.alpha * 0.35})`;
      ctx.lineWidth = 5; ctx.shadowColor = '#5EE7FF'; ctx.shadowBlur = 20;
      ctx.arc(0, 0, sw.r, -0.75, 0.75); ctx.stroke(); ctx.fill(); ctx.restore();
    }

    const grad = ctx.createRadialGradient(-6,-8,3,0,0,p.r);
    grad.addColorStop(0,'#8E44AD'); grad.addColorStop(0.6,'#2C3E50'); grad.addColorStop(1,'#0F172A');
    ctx.beginPath(); ctx.fillStyle = grad;
    ctx.ellipse(0,0,p.r,p.r*0.75,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#00F0FF'; ctx.lineWidth = 2.5; ctx.stroke();

    for(const s of [-1,1]){
      const ex = Math.cos(faceAng)*p.r*0.45 + Math.cos(faceAng+s*1.15)*p.r*0.4;
      const ey = Math.sin(faceAng)*p.r*0.45*0.7 + Math.sin(faceAng+s*1.15)*p.r*0.4*0.7;
      ctx.beginPath(); ctx.fillStyle = '#000000'; ctx.arc(ex,ey-p.r*0.12,p.r*0.22,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.fillStyle = '#FF0055'; ctx.shadowColor='#FF0055'; ctx.shadowBlur=14;
      ctx.arc(ex,ey-p.r*0.12,p.r*0.13,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    }

    const swing = p.clawTimer>0 ? Math.sin((1-p.clawTimer/CLAW_DURATION)*Math.PI)*1.1 : 0.2;
    for(const s of [-1,1]){
      ctx.save(); ctx.rotate(faceAng); ctx.translate(p.r*0.8, s*p.r*0.6); ctx.rotate(s*(0.85+swing));
      ctx.beginPath(); ctx.fillStyle = '#1A0933'; ctx.strokeStyle = '#FF5EC8'; ctx.lineWidth = 3;
      ctx.shadowColor = '#FF5EC8'; ctx.shadowBlur = p.clawTimer>0 ? 25 : 8;
      ctx.ellipse(0, 0, p.r*0.65, p.r*0.35, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawParticles(){
    for(const pt of particles){
      const a = 1 - pt.life/pt.maxLife;
      ctx.beginPath(); ctx.fillStyle = pt.color; ctx.globalAlpha = Math.max(0,a);
      ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    }
  }

  function render(t){
    drawStars(t);
    drawGrenades();
    drawPlayerBullets();
    for(const en of enemies) drawEnemy(en);
    drawEnemyBullets();
    drawParticles();
    if(running) drawPlayer();
  }

  // ---------------- HUD ----------------
  const stageLabelEl = document.getElementById('stageLabel');
  const livesEl = document.getElementById('lives');
  const bossBarEl = document.getElementById('bossBar');
  const bossTitleEl = document.getElementById('bossTitle');
  const scoreEl = document.getElementById('score');
  const grenadeBarEl = document.getElementById('grenadeBar');

  function updateHUDStatic(){
    stageLabelEl.textContent = `STAGE ${stageNum}`;
    livesEl.innerHTML = '';
    for(let i=0;i<lives;i++){ const h=document.createElement('div'); h.className='heart'; livesEl.appendChild(h); }
  }
  function updateHUDDynamic(){
    if(livesEl.children.length !== lives){ updateHUDStatic(); }
    scoreEl.textContent = 'SCORE ' + score;
    
    const currentGrenadeInterval = BASE_GRENADE_INTERVAL * playerStats.grenadeCdMult;
    const gRatio = Math.min(1.0, player.grenadeTimer / currentGrenadeInterval);
    grenadeBarEl.style.width = (gRatio * 100) + '%';

    const boss = enemies.find(e=>e.type==='boss');
    if(boss){
      const ratio = Math.max(0, boss.hp / boss.maxHp);
      bossBarEl.style.width = (ratio * 100) + '%';
      bossTitleEl.textContent = `BOSS HP [${Math.ceil(boss.hp)} / ${boss.maxHp}]`;
    } else {
      bossBarEl.style.width = '0%';
      bossTitleEl.textContent = 'BOSS DEFEATED';
    }
  }

  // ---------------- Card Selection System ----------------
  const cardContainer = document.getElementById('cardContainer');

  function renderCardSelection(){
    cardContainer.innerHTML = '';
    const shuffled = [...CARD_POOL].sort(() => 0.5 - Math.random()).slice(0, 3);
    
    shuffled.forEach(cardData => {
      const cardEl = document.createElement('div');
      cardEl.className = `card ${cardData.type}`;
      cardEl.innerHTML = `
        <div class="card-icon">${cardData.icon}</div>
        <div class="card-title">${cardData.title}</div>
        <div class="card-tag">${cardData.type === 'buff' ? '강화 효과' : '리스크 변수'}</div>
        <div class="card-desc">${cardData.desc}</div>
      `;
      cardEl.addEventListener('click', ()=>{
        beep('card');
        cardData.apply();
        screenClear.classList.add('hidden');
        startStage(stageNum + 1);
      });
      cardContainer.appendChild(cardEl);
    });
  }

  // ---------------- Screens & Transitions ----------------
  const screenTitle = document.getElementById('screenTitle');
  const screenClear = document.getElementById('screenClear');
  const screenGameOver = document.getElementById('screenGameOver');
  const screenWin = document.getElementById('screenWin');
  const screenPause = document.getElementById('screenPause');

  function togglePause(){
    if(!running || stageCleared) return;
    paused = !paused;
    screenPause.classList.toggle('hidden', !paused);
  }

  function triggerStageClear(){
    stageCleared = true;
    beep('clear');
    if(stageNum >= 100){
      document.getElementById('winScore').textContent = `최종 점수: ${score}점`;
      screenWin.classList.remove('hidden');
    } else {
      document.getElementById('clearScore').textContent = `현재 누적 점수: ${score}점`;
      renderCardSelection();
      screenClear.classList.remove('hidden');
    }
  }

  function triggerGameOver(){
    running = false;
    beep('over');
    document.getElementById('overStats').textContent = `도달 스테이지: STAGE ${stageNum} | 최종 점수: ${score}점`;
    screenGameOver.classList.remove('hidden');
  }

  // Button Listeners
  document.getElementById('startBtn').addEventListener('click', ()=>{
    screenTitle.classList.add('hidden');
    score = 0;
    resetPlayerStats();
    running = true;
    startStage(1);
  });

  document.getElementById('retryBtn').addEventListener('click', ()=>{
    screenGameOver.classList.add('hidden');
    score = 0;
    resetPlayerStats();
    running = true;
    startStage(1);
  });

  document.getElementById('winRetryBtn').addEventListener('click', ()=>{
    screenWin.classList.add('hidden');
    score = 0;
    resetPlayerStats();
    running = true;
    startStage(1);
  });

  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  // ---------------- Game Loop ----------------
  let lastT = performance.now();
  function gameLoop(now){
    const dt = Math.min(0.05, (now - lastT)/1000);
    lastT = now;

    update(dt);
    render(now);

    requestAnimationFrame(gameLoop);
  }
  requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
