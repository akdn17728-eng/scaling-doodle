<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>광란의 우주 - 우주게 대모험 (풀오토 하드코어)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
  :root{ --void:#04010A; }
  *{box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;}
  html,body{ background:var(--void); height:100%; overflow:hidden; font-family:'Orbitron',sans-serif; }
  #game{ position:fixed; inset:0; display:block; }

  body.shake{ animation: shake 0.2s linear; }
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-8px,6px); }
    40%{ transform:translate(8px,-6px); }
    60%{ transform:translate(-6px,-4px); }
    80%{ transform:translate(6px,4px); }
  }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:10px 16px; pointer-events:none;
    background:linear-gradient(rgba(4,1,10,0.85), rgba(4,1,10,0));
  }
  .hud-block{
    display:flex; align-items:center; gap:6px;
    color:#EAFFFC; font-size:12px; letter-spacing:0.05em;
    text-shadow:0 0 8px rgba(94,231,255,0.6);
  }
  #stageLabel{ font-size:14px; font-weight:900; color:#5EE7FF; }
  #lives{ display:flex; gap:4px; flex-wrap:wrap; max-width:140px; }
  .heart{ width:14px; height:14px; border-radius:50% 50% 50% 0; background:#FF5EC8; transform:rotate(-45deg);
    box-shadow:0 0 8px #FF5EC8; }
  #progressWrap{
    flex:1; height:10px; border-radius:6px; background:rgba(255,255,255,0.08);
    border:1px solid rgba(94,231,255,0.35); overflow:hidden; max-width:340px; min-width:80px;
  }
  #progressBar{ height:100%; width:0%; background:linear-gradient(90deg,#5EE7FF,#FF2D70); transition:width 0.25s ease; }
  #score{ font-size:13px; color:#FFD25E; text-shadow:0 0 8px rgba(255,210,80,0.7); }
  #muteBtn{
    pointer-events:auto; cursor:pointer; background:rgba(10,4,24,0.5);
    border:1px solid rgba(94,231,255,0.5); color:#EAFFFC; border-radius:8px;
    font-family:'Orbitron',sans-serif; font-size:11px; padding:6px 10px;
  }

  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:radial-gradient(circle at 50% 40%, rgba(50,10,70,0.7), rgba(4,1,10,0.95));
    text-align:center; padding:24px; gap:18px;
  }
  .overlay.hidden{ display:none; }
  .overlay h1{
    font-size:clamp(1.8rem,7vw,3.4rem); font-weight:900; color:#EAFFFC;
    text-shadow:0 0 10px rgba(94,231,255,0.9), 0 0 30px rgba(255,45,180,0.8);
    letter-spacing:0.04em;
  }
  .overlay p{ color:rgba(234,255,252,0.85); font-size:clamp(0.75rem,2.4vw,0.95rem); max-width:540px; line-height:1.7; letter-spacing:0.03em;}
  .overlay .sub{ color:#FFD25E; font-size:clamp(0.85rem,2.6vw,1.1rem); font-weight:700; }
  .neon-btn{
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:clamp(0.9rem,2.6vw,1.15rem);
    letter-spacing:0.08em; padding:0.8em 2.2em; color:#EAFFFC;
    background:rgba(10,4,24,0.55); border:2px solid rgba(94,231,255,0.75); border-radius:999px;
    cursor:pointer; box-shadow:0 0 18px rgba(94,231,255,0.55), inset 0 0 14px rgba(94,231,255,0.15);
    transition:transform .15s ease, background .15s ease;
  }
  .neon-btn:hover{ transform:scale(1.06); background:rgba(94,231,255,0.16); }
  .neon-btn:active{ transform:scale(0.96); }
  .neon-btn.pink{ border-color:rgba(255,94,200,0.8); box-shadow:0 0 18px rgba(255,94,200,0.5), inset 0 0 14px rgba(255,94,200,0.15); }

  /* ---------- Touch controls ---------- */
  #touchControls{ position:fixed; inset:0; z-index:15; pointer-events:none; display:none; }
  body.touch #touchControls{ display:block; }
  #stick{
    position:fixed; left:26px; bottom:26px; width:130px; height:130px; border-radius:50%;
    background:rgba(94,231,255,0.08); border:2px solid rgba(94,231,255,0.4); pointer-events:auto;
  }
  #stickKnob{
    position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px;
    border-radius:50%; background:rgba(94,231,255,0.35); border:2px solid rgba(94,231,255,0.8);
    box-shadow:0 0 14px rgba(94,231,255,0.6);
  }
  #attackBtn{
    position:fixed; right:30px; bottom:34px; width:92px; height:92px; border-radius:50%;
    background:rgba(255,94,200,0.25); border:2px solid rgba(255,94,200,0.9); pointer-events:auto;
    color:#EAFFFC; font-size:13px; font-weight:900; letter-spacing:0.05em;
    display:flex; align-items:center; justify-content:center; text-align:center;
    box-shadow:0 0 25px rgba(255,94,200,0.7);
  }

  @media (max-width:640px){
    .hud-block{ font-size:10px; }
    #stageLabel{ font-size:12px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-block" id="stageLabel">STAGE 1 / 100</div>
  <div class="hud-block" id="lives"></div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div class="hud-block" id="score">SCORE 0</div>
  <button id="muteBtn">🔊 소리</button>
</div>

<div id="touchControls">
  <div id="stick"><div id="stickKnob"></div></div>
  <div id="attackBtn">플라즈마<br>참격</div>
</div>

<div class="overlay" id="screenTitle">
  <h1>광란의 우주 : 풀오토 바주카</h1>
  <p class="sub">우주게 대모험 · HARDCORE 100 STAGE</p>
  <p>자동으로 연속 발사되는 <b style="color:#5EE7FF">플라즈마 기관총</b> 탑재!<br>
  위급할 땐 <b style="color:#FF5EC8">스페이스바(근접 참격)</b>로 탄환을 지우고 적을 밀어내세요.<br>
  적들의 내구도가 대폭 강화되어 여러 번 사격해야 파괴할 수 있습니다!</p>
  <button class="neon-btn" id="startBtn">출격하기</button>
</div>

<div class="overlay hidden" id="screenClear">
  <h1 id="clearTitle">STAGE CLEAR!</h1>
  <p class="sub" id="clearScore"></p>
  <button class="neon-btn" id="nextBtn">다음 스테이지</button>
</div>

<div class="overlay hidden" id="screenGameOver">
  <h1 style="color:#FF5EC8">MISSION FAILED</h1>
  <p class="sub" id="overStats"></p>
  <button class="neon-btn pink" id="retryBtn">처음부터 다시</button>
</div>

<div class="overlay hidden" id="screenWin">
  <h1 style="color:#FFD25E">🏆 전설의 은하 지배자 🏆</h1>
  <p class="sub" id="winScore"></p>
  <p>모든 시련을 이겨내고 우주의 평화를 되찾았습니다!</p>
  <button class="neon-btn" id="winRetryBtn">다시 도전하기</button>
</div>

<div class="overlay hidden" id="screenPause">
  <h1>일시정지</h1>
  <p>WASD/방향키 이동 · 스페이스바 특수 참격 · P 일시정지</p>
  <button class="neon-btn" id="resumeBtn">계속하기</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H;
  const HUD_H = 70;

  // ---------------- Audio ----------------
  let actx=null, muted=false;
  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function beep(type){
    if(muted || !actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const now = actx.currentTime;
    let freq=440, dur=0.12, wave='sine';
    if(type==='eat'){ freq=750; dur=0.08; wave='triangle'; }
    else if(type==='shoot'){ freq=880; dur=0.04; wave='square'; }
    else if(type==='attack'){ freq=320; dur=0.12; wave='sawtooth'; }
    else if(type==='kill'){ freq=600; dur=0.18; wave='square'; }
    else if(type==='hurt'){ freq=120; dur=0.3; wave='sawtooth'; }
    else if(type==='clear'){ freq=880; dur=0.45; wave='triangle'; }
    else if(type==='over'){ freq=90; dur=0.7; wave='sawtooth'; }
    o.type = wave; o.frequency.setValueAtTime(freq, now);
    if(type==='shoot'){ o.frequency.exponentialRampToValueAtTime(300, now+dur); }
    if(type==='attack'){ o.frequency.exponentialRampToValueAtTime(120, now+dur); }
    if(type==='clear'){ o.frequency.exponentialRampToValueAtTime(freq*1.8, now+dur); }
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(type==='shoot'?0.08:0.25, now+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.start(now); o.stop(now+dur+0.02);
  }

  // ---------------- Palettes ----------------
  const planetColors = ['#FF5EC8','#5EE7FF','#FFD25E','#7CE07C','#FF7A9C','#B58CFF'];
  const NORMAL_ENEMY = { asteroid:'#00E5FF', scout:'#FF00A0', hunter:'#FF3300', bullet:'#FFD25E' };
  const BOSS_COLOR = '#A000FF';

  // ---------------- Game State ----------------
  let stageNum = 1;
  let lives = 5;
  const MAX_LIVES = 7;
  let score = 0;
  let running = false;
  let paused = false;
  let stageCleared = false;
  let planetsEaten = 0;
  let bossDefeated = false;
  let stageCfg = null;

  const player = { 
    x:0,y:0,r:28,vx:0,vy:0, faceX:1, faceY:0, inv:0, 
    clawTimer:0, clawCd:0, clawAngle:0,
    autoShootCd: 0 // 자동 사격 쿨타임
  };

  let planets = [];
  let enemies = [];
  let playerBullets = []; // 플레이어 총탄
  let enemyBullets = [];
  let particles = [];
  let shockwaves = [];

  const CLAW_DURATION = 0.22, CLAW_COOLDOWN = 0.35;
  const ACCEL = 2200, MAXSPEED = 380, FRICTION = 6.5;
  const AUTO_SHOOT_INTERVAL = 0.12; // 자동 연사 속도 (0.12초마다 발사)

  // ---------------- Input ----------------
  const keys = {};
  let touchVec = {x:0,y:0};
  let touchActive = false;

  window.addEventListener('keydown', (e)=>{
    ensureAudio();
    keys[e.code] = true;
    if(e.code==='Space'){ triggerClaw(); e.preventDefault(); }
    if(e.code==='KeyP' || e.code==='Escape'){ togglePause(); }
  });
  window.addEventListener('keyup', (e)=>{ keys[e.code]=false; });

  function inputVector(){
    if(touchActive){ return touchVec; }
    let x=0,y=0;
    if(keys['ArrowLeft']||keys['KeyA']) x-=1;
    if(keys['ArrowRight']||keys['KeyD']) x+=1;
    if(keys['ArrowUp']||keys['KeyW']) y-=1;
    if(keys['ArrowDown']||keys['KeyS']) y+=1;
    const len = Math.hypot(x,y);
    if(len>1){ x/=len; y/=len; }
    return {x,y};
  }

  if(matchMedia('(pointer:coarse)').matches){ document.body.classList.add('touch'); }
  const stickEl = document.getElementById('stick');
  const stickKnob = document.getElementById('stickKnob');
  const attackBtn = document.getElementById('attackBtn');
  let stickId = null, stickOrigin = {x:0,y:0};

  stickEl.addEventListener('touchstart', (e)=>{
    ensureAudio();
    const t = e.changedTouches[0];
    stickId = t.identifier;
    const r = stickEl.getBoundingClientRect();
    stickOrigin = { x:r.left+r.width/2, y:r.top+r.height/2 };
    touchActive = true;
    e.preventDefault();
  }, {passive:false});
  stickEl.addEventListener('touchmove', (e)=>{
    for(const t of e.changedTouches){
      if(t.identifier===stickId){
        let dx = t.clientX - stickOrigin.x, dy = t.clientY - stickOrigin.y;
        const max = 46;
        const d = Math.hypot(dx,dy);
        if(d>max){ dx = dx/d*max; dy = dy/d*max; }
        stickKnob.style.transform = `translate(${dx}px,${dy}px)`;
        touchVec = { x: dx/max, y: dy/max };
      }
    }
    e.preventDefault();
  }, {passive:false});
  function stickEnd(e){
    for(const t of e.changedTouches){
      if(t.identifier===stickId){
        stickId=null; touchActive=false; touchVec={x:0,y:0};
        stickKnob.style.transform = 'translate(0,0)';
      }
    }
  }
  stickEl.addEventListener('touchend', stickEnd);
  stickEl.addEventListener('touchcancel', stickEnd);
  attackBtn.addEventListener('touchstart', (e)=>{ ensureAudio(); triggerClaw(); e.preventDefault(); }, {passive:false});

  // ---------------- Resize ----------------
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------- Stars background ----------------
  let stars = [];
  function buildStars(){
    stars = Array.from({length: Math.floor((W*H)/5000)}, ()=>({
      x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.8+0.5,
      tw: Math.random()*Math.PI*2, sp: Math.random()*3+1
    }));
  }
  buildStars();
  window.addEventListener('resize', buildStars);

  // ---------------- Stage Generation (적 HP 상향) ----------------
  function genStage(n){
    const isBoss = n % 10 === 0;
    const planetsNeeded = isBoss ? 4 : Math.min(22, 5 + Math.floor(n/4));
    const enemyCount = isBoss ? 0 : Math.min(26, 5 + Math.floor(n*0.5));
    const speedBase = 110 + Math.min(220, n*2.0);
    // 보스 HP 대폭 상향
    const bossHp = 40 + Math.floor(n/10)*25;
    const scoutUnlocked = n>=2;
    const hunterUnlocked = n>=8;
    return {isBoss, planetsNeeded, enemyCount, speedBase, bossHp, scoutUnlocked, hunterUnlocked, n};
  }

  function rand(a,b){ return a + Math.random()*(b-a); }

  function spawnPlanets(cfg){
    planets = [];
    let tries=0;
    while(planets.length < cfg.planetsNeeded && tries < 500){
      tries++;
      const x = rand(60, W-60), y = rand(HUD_H+60, H-60);
      if(Math.hypot(x-player.x,y-player.y) < 140) continue;
      let ok = true;
      for(const p of planets){ if(Math.hypot(x-p.x,y-p.y) < 65){ ok=false; break; } }
      if(!ok) continue;
      planets.push({ x,y, r: rand(16,26), color: planetColors[Math.floor(Math.random()*planetColors.length)],
        eaten:false, bob: Math.random()*Math.PI*2 });
    }
  }

  function spawnEnemy(type, cfg, boss){
    const edge = Math.floor(Math.random()*4);
    let x,y;
    if(edge===0){ x=rand(0,W); y=HUD_H+10; }
    else if(edge===1){ x=rand(0,W); y=H-10; }
    else if(edge===2){ x=10; y=rand(HUD_H,H); }
    else { x=W-10; y=rand(HUD_H,H); }
    const ang = Math.atan2((player.y||H/2)-y, (player.x||W/2)-x) + rand(-0.5,0.5);
    let speed, r, hp, color;
    
    // 🔥 적들의 체력(HP) 대폭 상향! (여러 번 사격해야 파괴 가능)
    if(boss){ speed = cfg.speedBase*0.45; r = 70; hp = cfg.bossHp; color = BOSS_COLOR; }
    else if(type==='hunter'){ speed = cfg.speedBase*1.15; r = 24; hp = 22 + Math.floor(cfg.n*0.5); color = NORMAL_ENEMY.hunter; }
    else if(type==='scout'){ speed = cfg.speedBase*0.9; r = 20; hp = 12 + Math.floor(cfg.n*0.3); color = NORMAL_ENEMY.scout; }
    else { speed = cfg.speedBase*0.65; r = 22; hp = 6 + Math.floor(cfg.n*0.2); color = NORMAL_ENEMY.asteroid; }
    
    enemies.push({
      x,y, vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed, r, hp, maxHp:hp,
      type: boss?'boss':type, speed, color, dead:false, flash:0, spin: Math.random()*Math.PI*2,
      shootCd: rand(1.0, 2.5)
    });
  }

  function spawnStageEntities(cfg){
    enemies = [];
    enemyBullets = [];
    playerBullets = [];
    if(cfg.isBoss){
      spawnEnemy(null, cfg, true);
    } else {
      for(let i=0;i<cfg.enemyCount;i++){
        let type = 'asteroid';
        const r = Math.random();
        if(cfg.hunterUnlocked && r < 0.35) type = 'hunter';
        else if(cfg.scoutUnlocked && r < 0.70) type = 'scout';
        spawnEnemy(type, cfg, false);
      }
    }
  }

  function startStage(n){
    stageNum = n;
    stageCfg = genStage(n);
    planetsEaten = 0;
    bossDefeated = false;
    stageCleared = false;
    player.x = W/2; player.y = H/2 + 40;
    player.vx=0; player.vy=0; player.inv=1200;
    spawnPlanets(stageCfg);
    spawnStageEntities(stageCfg);
    particles = [];
    shockwaves = [];
    updateHUDStatic();
  }

  // ---------------- Player Auto-Shoot & Claw ----------------
  function autoShoot(dt){
    player.autoShootCd -= dt;
    if(player.autoShootCd <= 0){
      player.autoShootCd = AUTO_SHOOT_INTERVAL;
      const faceAng = Math.atan2(player.faceY, player.faceX);
      const bSpeed = 750;
      
      // 양쪽 게집게 근처에서 탄환 2발 자동 발사
      for(const side of [-1, 1]){
        const offX = Math.cos(faceAng)*player.r + Math.cos(faceAng + side*1.2)*16;
        const offY = Math.sin(faceAng)*player.r + Math.sin(faceAng + side*1.2)*16;
        playerBullets.push({
          x: player.x + offX,
          y: player.y + offY,
          vx: Math.cos(faceAng)*bSpeed,
          vy: Math.sin(faceAng)*bSpeed,
          r: 4,
          life: 1.2
        });
      }
      beep('shoot');
    }
  }

  function normAngle(a){ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; }

  function triggerClaw(){
    if(!running || paused || stageCleared) return;
    if(player.clawCd > 0) return;
    player.clawCd = CLAW_COOLDOWN;
    player.clawTimer = CLAW_DURATION;
    const faceAng = Math.atan2(player.faceY, player.faceX);
    player.clawAngle = faceAng;
    beep('attack');

    shockwaves.push({
      x: player.x + Math.cos(faceAng)*30,
      y: player.y + Math.sin(faceAng)*30,
      ang: faceAng,
      r: 30, maxR: 130, alpha: 1
    });

    // 강력한 근접 참격 (큰 데미지 + 강력한 넉백)
    const range = player.r + 100;
    for(const en of enemies){
      if(en.dead) continue;
      const dx = en.x-player.x, dy = en.y-player.y;
      const dist = Math.hypot(dx,dy);
      if(dist < range + en.r){
        const ang = Math.atan2(dy,dx);
        const diff = Math.abs(normAngle(ang-faceAng));
        if(diff < Math.PI*0.72){
          en.hp -= 8; // 강력한 근접 데미지
          en.flash = 0.25;
          const push = 300;
          en.vx += Math.cos(ang)*push; en.vy += Math.sin(ang)*push;
          spawnParticles(en.x, en.y, '#5EE7FF', 12);

          if(en.hp <= 0){
            en.dead = true;
            score += en.type==='boss' ? 500 : 35;
            spawnParticles(en.x, en.y, en.color, en.type==='boss'?50:20);
            beep('kill');
            if(en.type==='boss') bossDefeated = true;
          }
        }
      }
    }
  }

  // ---------------- Particles ----------------
  function spawnParticles(x,y,color,count){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = rand(80,340);
      particles.push({ x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:0, maxLife: rand(0.3,0.65), color, r: rand(2,5) });
    }
  }

  // ---------------- Update ----------------
  let lastTime = 0;
  function update(dt){
    if(!running || paused || stageCleared) return;

    // 이동
    const iv = inputVector();
    player.vx += iv.x*ACCEL*dt;
    player.vy += iv.y*ACCEL*dt;
    player.vx /= (1+FRICTION*dt);
    player.vy /= (1+FRICTION*dt);
    const spd = Math.hypot(player.vx,player.vy);
    if(spd > MAXSPEED){ player.vx = player.vx/spd*MAXSPEED; player.vy = player.vy/spd*MAXSPEED; }
    player.x += player.vx*dt;
    player.y += player.vy*dt;
    player.x = Math.max(player.r, Math.min(W-player.r, player.x));
    player.y = Math.max(HUD_H+player.r, Math.min(H-player.r, player.y));
    if(spd > 20){ player.faceX = player.vx/spd; player.faceY = player.vy/spd; }

    if(player.inv>0) player.inv -= dt*1000;
    if(player.clawTimer>0) player.clawTimer -= dt;
    if(player.clawCd>0) player.clawCd -= dt;

    // 자동 사격 처리
    autoShoot(dt);

    // 충격파
    for(const sw of shockwaves){
      sw.r += dt*400;
      sw.alpha -= dt*3.2;
    }
    shockwaves = shockwaves.filter(sw=>sw.alpha>0);

    // 플레이어 총탄 업데이트 및 충돌 검사
    for(const pb of playerBullets){
      pb.x += pb.vx*dt;
      pb.y += pb.vy*dt;
      pb.life -= dt;

      // 적과 레이저 충돌
      for(const en of enemies){
        if(en.dead) continue;
        if(Math.hypot(pb.x-en.x, pb.y-en.y) < pb.r + en.r){
          pb.dead = true;
          en.hp -= 1; // 탄환 당 1 데미지
          en.flash = 0.1;
          spawnParticles(pb.x, pb.y, '#5EE7FF', 3);
          
          if(en.hp <= 0){
            en.dead = true;
            score += en.type==='boss' ? 500 : 35;
            spawnParticles(en.x, en.y, en.color, en.type==='boss'?50:20);
            beep('kill');
            if(en.type==='boss') bossDefeated = true;
          }
          break;
        }
      }
    }
    playerBullets = playerBullets.filter(pb => !pb.dead && pb.life > 0 && pb.x>=0 && pb.x<=W && pb.y>=HUD_H && pb.y<=H);

    // 행성
    for(const p of planets){
      if(p.eaten) continue;
      p.bob += dt*2.5;
      if(Math.hypot(p.x-player.x, p.y-player.y) < p.r + player.r*0.75){
        p.eaten = true;
        planetsEaten++;
        score += 15;
        spawnParticles(p.x,p.y,p.color,16);
        beep('eat');
      }
    }

    // 적 업데이트 및 행동
    for(const en of enemies){
      if(en.dead) continue;
      if(en.flash>0) en.flash -= dt;
      en.spin += dt*3;
      if(en.type==='scout' || en.type==='hunter' || en.type==='boss'){
        const dx = player.x-en.x, dy = player.y-en.y;
        const d = Math.hypot(dx,dy)||1;
        const homing = en.type==='hunter' ? 320 : (en.type==='boss' ? 180 : 220);
        en.vx += (dx/d)*homing*dt;
        en.vy += (dy/d)*homing*dt;
      }

      if(en.type==='boss'){
        en.shootCd -= dt;
        if(en.shootCd <= 0){
          en.shootCd = rand(1.2, 2.2);
          const bulletsCount = 10;
          for(let b=0; b<bulletsCount; b++){
            const bAng = (b/bulletsCount)*Math.PI*2 + en.spin;
            enemyBullets.push({
              x: en.x, y: en.y,
              vx: Math.cos(bAng)*190, vy: Math.sin(bAng)*190,
              r: 6, color: NORMAL_ENEMY.bullet
            });
          }
        }
      }

      const sp = Math.hypot(en.vx,en.vy);
      const cap = en.speed*1.4;
      if(sp>cap){ en.vx = en.vx/sp*cap; en.vy = en.vy/sp*cap; }
      en.x += en.vx*dt; en.y += en.vy*dt;
      if(en.x < en.r){ en.x=en.r; en.vx*=-1; }
      if(en.x > W-en.r){ en.x=W-en.r; en.vx*=-1; }
      if(en.y < HUD_H+en.r){ en.y=HUD_H+en.r; en.vy*=-1; }
      if(en.y > H-en.r){ en.y=H-en.r; en.vy*=-1; }

      // 플레이어와 적 충돌
      if(player.inv<=0 && Math.hypot(en.x-player.x,en.y-player.y) < en.r+player.r*0.85){
        lives--;
        player.inv = 1400;
        beep('hurt');
        document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
        const ang = Math.atan2(player.y-en.y, player.x-en.x);
        player.vx += Math.cos(ang)*300; player.vy += Math.sin(ang)*300;
        spawnParticles(player.x,player.y,'#FF5EC8',16);
        if(lives<=0){ triggerGameOver(); return; }
      }
    }
    enemies = enemies.filter(e=>!e.dead);

    // 적 총탄
    for(const b of enemyBullets){
      b.x += b.vx*dt;
      b.y += b.vy*dt;
      if(player.inv<=0 && Math.hypot(b.x-player.x, b.y-player.y) < b.r + player.r*0.8){
        lives--;
        player.inv = 1400;
        b.dead = true;
        beep('hurt');
        document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
        spawnParticles(player.x,player.y,'#FF5EC8',14);
        if(lives<=0){ triggerGameOver(); return; }
      }
    }
    enemyBullets = enemyBullets.filter(b=> !b.dead && b.x>=0 && b.x<=W && b.y>=HUD_H && b.y<=H);

    // 파티클
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life+=dt; p.vx*=0.93; p.vy*=0.93; }
    particles = particles.filter(p=>p.life<p.maxLife);

    updateHUDDynamic();

    if(!stageCleared){
      if(stageCfg.isBoss){ if(bossDefeated) triggerStageClear(); }
      else { if(planetsEaten >= stageCfg.planetsNeeded) triggerStageClear(); }
    }
  }

  // ---------------- Draw ----------------
  function drawStars(t){
    ctx.fillStyle = 'rgba(4,1,10,1)';
    ctx.fillRect(0,0,W,H);
    for(const s of stars){
      const a = 0.4 + Math.sin(t*0.001*s.sp + s.tw)*0.4 + 0.2;
      ctx.beginPath();
      ctx.fillStyle = `rgba(200,220,255,${Math.max(0.15,a)})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawPlanet(p){
    if(p.eaten) return;
    const yy = p.y + Math.sin(p.bob)*4;
    ctx.save();
    const grad = ctx.createRadialGradient(p.x-p.r*0.3,yy-p.r*0.3,2, p.x,yy,p.r);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(0.35,p.color);
    grad.addColorStop(1,'#160d24');
    ctx.beginPath();
    ctx.fillStyle = grad;
    ctx.shadowColor = p.color; ctx.shadowBlur = 18;
    ctx.arc(p.x,yy,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // 🔥 멋지게 새로 디자인된 일반 적 및 보스 그래픽
  function drawEnemy(en){
    ctx.save();
    ctx.translate(en.x,en.y);
    const moveAng = Math.atan2(en.vy, en.vx);
    const isFlashing = en.flash > 0;
    
    ctx.shadowColor = en.color;
    ctx.shadowBlur = isFlashing ? 30 : 15;
    ctx.strokeStyle = isFlashing ? '#FFFFFF' : en.color;
    ctx.fillStyle = isFlashing ? '#FFFFFF' : '#0D081D';
    ctx.lineWidth = 2.5;

    if(en.type==='asteroid'){
      // [사이버 암석] 크리스탈 코어를 가진 강화 운석
      ctx.rotate(en.spin);
      ctx.beginPath();
      for(let i=0; i<6; i++){
        const a = (i/6)*Math.PI*2;
        const rr = en.r * (i%2===0 ? 1 : 0.75);
        const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      
      // 내부에 빛나는 크리스탈 코어
      ctx.beginPath();
      ctx.fillStyle = isFlashing ? '#FFFFFF' : en.color;
      ctx.arc(0,0,en.r*0.35,0,Math.PI*2); ctx.fill();

    } else if(en.type==='scout'){
      // [네온 정찰기] 날렵한 SF 제트기 형상
      ctx.rotate(moveAng);
      ctx.beginPath();
      ctx.moveTo(en.r*1.2, 0);
      ctx.lineTo(-en.r*0.8, -en.r*0.8);
      ctx.lineTo(-en.r*0.3, 0);
      ctx.lineTo(-en.r*0.8, en.r*0.8);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // 전방 서치라이트 및 날개 발광선
      ctx.beginPath();
      ctx.fillStyle = isFlashing ? '#FFFFFF' : '#FFD25E';
      ctx.arc(en.r*0.4, 0, en.r*0.25, 0, Math.PI*2); ctx.fill();

    } else if(en.type==='hunter'){
      // [듀얼 나이프 추적자] 맹렬한 위협형 크루저
      ctx.rotate(moveAng);
      ctx.beginPath();
      ctx.moveTo(en.r*1.3, 0);
      ctx.lineTo(en.r*0.3, -en.r*0.9);
      ctx.lineTo(-en.r*0.9, -en.r*0.5);
      ctx.lineTo(-en.r*0.4, 0);
      ctx.lineTo(-en.r*0.9, en.r*0.5);
      ctx.lineTo(en.r*0.3, en.r*0.9);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // 중앙 고출력 엔진
      ctx.beginPath();
      ctx.fillStyle = isFlashing ? '#FFFFFF' : '#FF0055';
      ctx.arc(-en.r*0.2, 0, en.r*0.3, 0, Math.PI*2); ctx.fill();

    } else if(en.type==='boss'){
      // [거대 보스 코어]
      ctx.rotate(en.spin*0.5);
      ctx.beginPath(); ctx.arc(0,0,en.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      
      // 보스 붉은 눈빛
      ctx.beginPath(); ctx.fillStyle = isFlashing?'#FFFFFF':'#FF0055';
      ctx.arc(-en.r*0.35,-en.r*0.2,en.r*0.2,0,Math.PI*2);
      ctx.arc(en.r*0.35,-en.r*0.2,en.r*0.2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // 체력바 표시 (보스 및 상향된 일반 적들)
    if(en.hp < en.maxHp){
      const bw = en.r*2, bh=5;
      ctx.save();
      ctx.translate(en.x-bw/2, en.y-en.r-12);
      ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(0,0,bw,bh);
      ctx.fillStyle= en.type==='boss' ? '#FF2D3D' : '#00E5FF'; 
      ctx.fillRect(0,0,bw*(Math.max(0,en.hp)/en.maxHp),bh);
      ctx.restore();
    }
  }

  function drawPlayerBullets(){
    for(const pb of playerBullets){
      ctx.save();
      ctx.beginPath();
      ctx.fillStyle = '#5EE7FF';
      ctx.shadowColor = '#5EE7FF';
      ctx.shadowBlur = 10;
      ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawEnemyBullets(){
    for(const b of enemyBullets){
      ctx.save();
      ctx.beginPath();
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPlayer(){
    const p = player;
    ctx.save();
    ctx.translate(p.x,p.y);
    if(p.inv>0 && Math.floor(p.inv/90)%2===0){ ctx.globalAlpha = 0.35; }

    const faceAng = Math.atan2(p.faceY,p.faceX);

    // 플라즈마 참격파 이펙트
    for(const sw of shockwaves){
      ctx.save();
      ctx.translate(sw.x - p.x, sw.y - p.y);
      ctx.rotate(sw.ang);
      ctx.beginPath();
      ctx.strokeStyle = `rgba(94, 231, 255, ${sw.alpha})`;
      ctx.fillStyle = `rgba(255, 94, 200, ${sw.alpha * 0.35})`;
      ctx.lineWidth = 5;
      ctx.shadowColor = '#5EE7FF';
      ctx.shadowBlur = 20;
      ctx.arc(0, 0, sw.r, -0.7, 0.7);
      ctx.stroke(); ctx.fill();
      ctx.restore();
    }

    // 게 본체
    const grad = ctx.createRadialGradient(-6,-8,3,0,0,p.r);
    grad.addColorStop(0,'#8E44AD'); grad.addColorStop(0.6,'#2C3E50'); grad.addColorStop(1,'#0F172A');
    ctx.beginPath(); ctx.fillStyle = grad;
    ctx.ellipse(0,0,p.r,p.r*0.75,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#00F0FF'; ctx.lineWidth = 2.5; ctx.stroke();

    // 눈빛
    for(const s of [-1,1]){
      const ex = Math.cos(faceAng)*p.r*0.45 + Math.cos(faceAng+s*1.15)*p.r*0.4;
      const ey = Math.sin(faceAng)*p.r*0.45*0.7 + Math.sin(faceAng+s*1.15)*p.r*0.4*0.7;
      ctx.beginPath(); ctx.fillStyle = '#000000';
      ctx.arc(ex,ey-p.r*0.12,p.r*0.22,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.fillStyle = '#FF0055'; ctx.shadowColor='#FF0055'; ctx.shadowBlur=14;
      ctx.arc(ex,ey-p.r*0.12,p.r*0.13,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    }

    // 네온 집게발 (자동 총구 겸용)
    const swing = p.clawTimer>0 ? Math.sin((1-p.clawTimer/CLAW_DURATION)*Math.PI)*1.1 : 0.2;
    for(const s of [-1,1]){
      ctx.save();
      ctx.rotate(faceAng);
      ctx.translate(p.r*0.8, s*p.r*0.6);
      ctx.rotate(s*(0.85+swing));
      
      ctx.beginPath();
      ctx.fillStyle = '#1A0933';
      ctx.strokeStyle = '#FF5EC8'; 
      ctx.lineWidth = 3;
      ctx.shadowColor = '#FF5EC8';
      ctx.shadowBlur = p.clawTimer>0 ? 25 : 8;
      ctx.ellipse(0, 0, p.r*0.65, p.r*0.35, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      
      // 총구 내부 크리스탈
      ctx.beginPath();
      ctx.fillStyle = '#5EE7FF';
      ctx.arc(p.r*0.2, 0, p.r*0.15, 0, Math.PI*2);
      ctx.fill();

      ctx.restore();
    }

    ctx.restore();
  }

  function drawParticles(){
    for(const pt of particles){
      const a = 1 - pt.life/pt.maxLife;
      ctx.beginPath();
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = Math.max(0,a);
      ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function render(t){
    drawStars(t);
    for(const p of planets) drawPlanet(p);
    drawPlayerBullets();
    for(const en of enemies) drawEnemy(en);
    drawEnemyBullets();
    drawParticles();
    if(running) drawPlayer();
  }

  // ---------------- HUD ----------------
  const stageLabelEl = document.getElementById('stageLabel');
  const livesEl = document.getElementById('lives');
  const progressBarEl = document.getElementById('progressBar');
  const scoreEl = document.getElementById('score');

  function updateHUDStatic(){
    stageLabelEl.textContent = stageCfg.isBoss ? `BOSS STAGE ${stageNum} / 100` : `STAGE ${stageNum} / 100`;
    livesEl.innerHTML = '';
    for(let i=0;i<lives;i++){ const h=document.createElement('div'); h.className='heart'; livesEl.appendChild(h); }
  }
  function updateHUDDynamic(){
    if(livesEl.children.length !== lives){ updateHUDStatic(); }
    scoreEl.textContent = 'SCORE ' + score;
    if(stageCfg.isBoss){
      const boss = enemies.find(e=>e.type==='boss');
      const ratio = boss ? boss.hp/boss.maxHp : 0;
      progressBarEl.style.width = (ratio*100)+'%';
    } else {
      progressBarEl.style.width = Math.min(100,(planetsEaten/stageCfg.planetsNeeded*100))+'%';
    }
  }

  // ---------------- Screens ----------------
  const screenTitle = document.getElementById('screenTitle');
  const screenClear = document.getElementById('screenClear');
  const screenGameOver = document.getElementById('screenGameOver');
  const screenWin = document.getElementById('screenWin');
  const screenPause = document.getElementById('screenPause');

  function triggerStageClear(){
    stageCleared = true;
    beep('clear');
    if(stageNum >= 100){
      document.getElementById('winScore').textContent = `최종 점수: ${score}`;
      screenWin.classList.remove('hidden');
      running = false;
      return;
    }
    document.getElementById('clearTitle').textContent = stageCfg.isBoss ? '보스 격파!' : `STAGE ${stageNum} CLEAR!`;
    document.getElementById('clearScore').textContent = `점수: ${score}   (다음: 스테이지 ${stageNum+1})`;
    screenClear.classList.remove('hidden');
  }

  function triggerGameOver(){
    running = false;
    beep('over');
    document.getElementById('overStats').textContent = `도달 스테이지: ${stageNum}   최종 점수: ${score}`;
    screenGameOver.classList.remove('hidden');
  }

  function togglePause(){
    if(!running || stageCleared) return;
    paused = !paused;
    screenPause.classList.toggle('hidden', !paused);
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{
    ensureAudio();
    screenTitle.classList.add('hidden');
    lives = 5; score = 0;
    running = true;
    startStage(1);
  });

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    screenClear.classList.add('hidden');
    let n = stageNum+1;
    if(n%12===0 && lives<MAX_LIVES) lives++; 
    startStage(n);
  });

  document.getElementById('retryBtn').addEventListener('click', ()=>{
    screenGameOver.classList.add('hidden');
    lives = 5; score = 0; running = true;
    startStage(1);
  });

  document.getElementById('winRetryBtn').addEventListener('click', ()=>{
    screenWin.classList.add('hidden');
    lives = 5; score = 0; running = true;
    startStage(1);
  });

  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  document.getElementById('muteBtn').addEventListener('click', ()=>{
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇 음소거' : '🔊 소리';
  });

  // ---------------- Loop ----------------
  function loop(t){
    if(!lastTime) lastTime = t;
    let dt = (t - lastTime)/1000;
    lastTime = t;
    if(dt > 0.05) dt = 0.05;
    update(dt);
    render(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
